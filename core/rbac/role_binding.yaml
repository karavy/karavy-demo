    app.kubernetes.io/name: karavy-core
    app.kubernetes.io/managed-by: kustomize
  name: karavy-core-manager-role-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: karavy-core-manager-role
subjects:
- kind: ServiceAccount
  name: karavy-core-controller-manager
  namespace: karavy-core

# permissions for end users to edit karavyroutings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: karavy-net
    app.kubernetes.io/managed-by: kustomize
  name: karavyrouting-editor-role
rules:
- apiGroups:
  - net.karavy.io
  resources:
  - karavyroutings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - net.karavy.io
  resources:
  - karavyroutings/status
  verbs:
  - get
